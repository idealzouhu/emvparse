name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
            asset_name: windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            triplet: x64-linux
            asset_name: linux-x64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER="1.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ -f CMakeLists.txt ]]; then
            PROJ_VER=$(grep -E '^project\(emvparse' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
            if [[ -n "$PROJ_VER" && "$PROJ_VER" != "$VER" && "${{ github.ref_type }}" == "tag" ]]; then
              echo "Tag version $VER does not match PROJECT_VERSION $PROJ_VER"
              exit 1
            fi
          fi

      - name: Read vcpkg tool version
        id: vcpkg_tool
        shell: bash
        run: echo "tag=$(tr -d '\n\r' < vcpkg-tool-version)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        id: vcpkg_tool_cache
        with:
          path: vcpkg
          key: vcpkg-tool-full-${{ runner.os }}-${{ steps.vcpkg_tool.outputs.tag }}

      - name: Clone vcpkg
        if: steps.vcpkg_tool_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg_tool.outputs.tag }}
          path: vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows' && steps.vcpkg_tool_cache.outputs.cache-hit != 'true'
        shell: cmd
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows' && steps.vcpkg_tool_cache.outputs.cache-hit != 'true'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg installed ports
        uses: actions/cache@v4
        id: vcpkg_installed_cache
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-tool-version') }}

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DVCPKG_MANIFEST_MODE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EMVPARSE_CLI=ON \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build and install
        run: |
          cmake --build build --config Release --parallel
          cmake --install build --config Release

      - name: Smoke test
        shell: bash
        run: |
          cd install/bin
          EXE=./emvparse
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXE=./emvparse.exe; fi
          "$EXE" --version
          "$EXE" parse 9F33020141 --scheme EMV | head -c 20

      - name: Pack (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path install/* -DestinationPath "emvparse-$ver-${{ matrix.asset_name }}.zip"

      - name: Pack (Linux)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          ver="${{ steps.ver.outputs.version }}"
          tar -czf "emvparse-${ver}-${{ matrix.asset_name }}.tar.gz" -C install .

      - name: Extract release notes from CHANGELOG
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          awk -v ver="$ver" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; print; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -qE '^### ' release-notes.md; then
            echo "No CHANGELOG section for version ${ver}"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: release-notes.md
          files: |
            emvparse-${{ steps.ver.outputs.version }}-${{ matrix.asset_name }}.*
